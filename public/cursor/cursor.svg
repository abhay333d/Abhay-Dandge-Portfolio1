<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#8afcff"/>
      <stop offset="60%" stop-color="#6ad1ff"/>
      <stop offset="100%" stop-color="#5b7bff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.0" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- outer soft glow ring (for hover accent) -->
  <circle cx="44" cy="20" r="10" fill="none" stroke="url(#g)" stroke-width="1.6" opacity="0.85" filter="url(#glow)"/>

  <!-- main triangular pointer -->
  <g transform="translate(6,6) scale(0.9)">
    <path d="M6 0 L34 20 L18 24 L22 40 L10 24 L6 0 Z" fill="black" opacity="0.85"/>
    <path d="M8 2 L32 20 L18 22 L20 36 L12 22 L8 2 Z" fill="url(#g)" opacity="0.95"/>
    <!-- subtle inner cutout to give a '3D slice' look -->
    <path d="M14 12 L24 18 L18 20 L12 14 Z" fill="black" opacity="0.18"/>
  </g>

  <!-- small central highlight dot -->
  <circle cx="42" cy="18" r="2.2" fill="white" opacity="0.95"/>
</svg>
